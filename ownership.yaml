# ══════════════════════════════════════════════════════════════════════════════
# Mobius Fleet — Ownership Map  (source of truth for module → owning agent)
# ══════════════════════════════════════════════════════════════════════════════
# THE RULE: every module has exactly one owner, and everyone understands it.
#
# WHY THIS FILE EXISTS
#   Git cannot tell us ownership — every commit across the fleet is authored as
#   "Ananth Lalithakumar", because the agents all commit as Ananth. Ownership is a
#   LOGICAL assignment that otherwise lives only in agent memories. This file makes
#   it declared, machine-checkable, and the resolvable target the Technical Day
#   uses to assign every defect (checklist #9).
#
# AUTHORITY
#   produced_by : Technical Review Agent (draft; never assigns real fleet work)
#   ratified_by : Ananth   <-- pending. See docs/fleet-ownership-and-new-agents-spec.md
#   Only Ananth assigns fleet ownership + creates the 2 new agents. Entries marked
#   `proposed` point at their TARGET owner and flip to `confirmed` on acknowledgment.
#
# STATUS VOCAB
#   confirmed         high-confidence, memory-settled or single-session-owned
#   proposed          target owner assigned; awaiting that agent's acknowledgment
#   platform          Ananth catch-all, pending an open decision (spec §5)
#   archive_candidate owned by an agent that may be archived — confirm first
#
# NEW agents (spec): Platform, Skills, Analytics, Extension, Auth, Appeals.
#   EXPANDED existing: RAG, DB→"Data & DB". (User Manager unchanged — auth split out.)
#
# TWO-LEVEL SKILLS OWNERSHIP: the Skills agent is CUSTODIAN of the mobius-skills
#   subsystem (repo, registry/dispatch law, skills-core runtime, skills-mcp bridge,
#   and any skill with no domain owner). Individual skills are DELEGATED to domain
#   agents for their logic (phi→PHI, task-manager→Task, cmhc→Analytics, ...).
#   Glob resolution encodes this: specific skill rules → domain agent; the
#   `mobius-skills/**` fallback → Skills agent.
#
# MATCHING: first matching `path` glob wins; most-specific (subdir) rules ABOVE
# the repo-level rule they live in. Paths are relative to the superrepo root.
# ══════════════════════════════════════════════════════════════════════════════

version: 2
ratified: false                 # flip true once Ananth has reviewed + created new agents
cycle_context: techday

