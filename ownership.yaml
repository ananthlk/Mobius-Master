    status: confirmed
    notes: "backs schematic nodes rag / library / lexicon"

  # Sub-path rule ABOVE the repo rule (most-specific wins, per MATCHING above).
  - path: "mobius-payor/app/robots.py"
    owner: "Crawler (Sourcing agent)"
    status: confirmed
    notes: >-
      The fleet's robots.txt / no-crawl compliance gate. Ananth 2026-08-12 made Crawler
      responsible for "everything we scrape related honoring the no crawl rules", and this
      file IS that gate, so ownership follows the responsibility. Handed over by Sources
      (mobius-payor/docs/sources-crawler-contract.md, "Inherited assets").
      ⚠️ DEPLOY-SENSITIVE: crawlable tri-state also feeds Router strategy-`d` selection, so
      changes here are a Router input change — coordinate with RAG + Technical Review, do
      not land unilaterally. Physically still in mobius-payor; migration deferred (Ananth:
      "if it needs to be migrated so be it") — the rest of mobius-payor stays Payor agent's.
      Payor agent + Technical Review notified.

  - path: "mobius-payor/**"
    owner: "Payor agent"
    status: confirmed

